name: "Mirror to Vercel-connected repo"

on:
  push:
    branches:
      - main-stores-dubai

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mohcly/djati-stores-mobile main
        run: |
          git push "https://x-access-token:${{ secrets.MOHCLY_DEPLOY_TOKEN }}@github.com/mohcly/djati-stores-mobile.git" "HEAD:main" --force
